name: lifeops-quality-bench

# Recorded-baseline LifeOps quality benchmarks + regression gate (#10723).
#
# Two keyless, deterministic lanes over REAL LifeOps code paths:
#
#   triage      — the plugin-inbox triage classifier's prompt-build → parse →
#                 validate → fail-closed path driven over a committed labeled
#                 56-item corpus with a committed fixed-quality mock model
#                 (fixtures). Precision/recall/accuracy/macro-F1 gate against
#                 budgets.json floors and must reproduce baseline.json exactly.
#   timeliness  — the plugin-personal-assistant scheduled-task tick
#                 (processDueScheduledTasks) replayed over two committed 4-day
#                 2026 DST windows (spring-forward + fall-back) at a 5-minute
#                 cadence on a real PGlite runtime with an injected clock.
#                 Missed/duplicate/early/occurrence-mismatch counts must be 0
#                 and fire-time deviation must stay under budgets.json ceilings.
#
# The code under test lives in elizaOS/eliza, so the gate lanes check out that
# repo and point ELIZA_REPO_DIR at it. No model bundle, no credentials.
# A red gate means a real quality regression in triage parsing/validation or
# scheduler fire behavior (or upstream drift in the plugin code under test).

on:
  pull_request:
    branches: [main]
    paths:
      - "suites/lifeops-quality/**"
      - ".github/workflows/lifeops-quality-bench.yml"
  schedule:
    # 05:40 UTC — alongside the other nightly benchmark lanes.
    - cron: "40 5 * * *"
  workflow_dispatch:
    inputs:
      eliza_ref:
        description: "elizaOS/eliza ref to test against"
        required: false
        type: string
        default: "develop"

concurrency:
  group: lifeops-quality-bench-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "24.15.0"

jobs:
  lifeops-quality-gate:
    name: triage P/R + reminder timeliness budget gate (keyless)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PGLITE_WASM_MODE: node
      ELIZA_REPO_DIR: ${{ github.workspace }}/eliza-repo
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Checkout elizaOS monorepo
        uses: actions/checkout@v4
        with:
          repository: elizaOS/eliza
          ref: ${{ inputs.eliza_ref || 'develop' }}
          path: eliza-repo
          submodules: false
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: canary

      - name: Install elizaOS workspace dependencies
        working-directory: eliza-repo
        run: bun install --no-frozen-lockfile

      # The timeliness gate boots the personal-assistant plugin barrel, which
      # imports sibling plugin dists. plugin-inbox is inside this dependency
      # graph, so the triage gate's classifier import is covered too.
      - name: Build personal-assistant dependency graph
        working-directory: eliza-repo
        run: node packages/scripts/run-turbo.mjs run build --filter='@elizaos/plugin-personal-assistant...'

      # --no-workspaces: the root bun/npm workspace currently fails to resolve
      # (unpublished @elizaos beta transitives); install this suite standalone.
      - name: Install lifeops-quality dependencies
        working-directory: suites/lifeops-quality
        run: npm install --no-workspaces --no-package-lock

      - name: Unit lane (metrics + oracle + corpus/fixture/baseline invariants)
        working-directory: suites/lifeops-quality
        run: bun run test

      - name: Triage precision/recall gate (real classifier, committed fixtures)
        working-directory: suites/lifeops-quality
        run: bun run bench:triage

      - name: Reminder timeliness gate (real scheduler tick, DST windows)
        timeout-minutes: 30
        working-directory: suites/lifeops-quality
        run: bun run bench:timeliness

      - name: Upload measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lifeops-quality-results
          path: suites/lifeops-quality/results/*.json
          if-no-files-found: ignore
