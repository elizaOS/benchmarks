# Repo CI — the minimal always-on gate for the standalone benchmarks repo.
#
# Four honest lanes:
#   python-syntax      — byte-compiles every Python tree (catches syntax/import-
#                        time breakage cheaply, no third-party deps needed).
#   root-pytest        — the suite-level tests/ directory (registry, scoring,
#                        normalization, acceptance gate). Needs only pytest;
#                        dataset-dependent cases skip gracefully when their
#                        artifacts are absent.
#   bun-workspace      — root bun install resolving @elizaos/* from the eliza/
#                        submodule (published @elizaos betas reference npm
#                        versions that were never published, so registry
#                        resolution is permanently broken), then the whole TS
#                        test surface: plugin-benchmarks + every suite with a
#                        keyless vitest/bun-test lane.
#   lifeops-bench-unit — the hermetic LifeOpsBench pytest suite (no LLM, no
#                        API keys), the largest self-contained test surface in
#                        the repo today.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.5.18"

jobs:
  python-syntax:
    name: python-syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Byte-compile all Python trees
        # terminal-bench/tasks is vendored task DATA; some tasks intentionally
        # contain broken/Python-2 sources the agent under test must fix.
        run: python -m compileall -q -x 'terminal-bench/tasks' suites harnesses lib framework registry tests scripts *.py

  root-pytest:
    name: root pytest (suite-level tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # The repo imports as the `benchmarks` Python package, so the checkout
      # must live in a directory named `benchmarks` with its parent on
      # PYTHONPATH (see the root CLAUDE.md).
      - uses: actions/checkout@v4
        with:
          path: benchmarks
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run suite-level tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest benchmarks/tests -q

  bun-workspace:
    name: bun workspace (plugin + TS suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-eliza
      - name: plugin-benchmarks (test + typecheck + build)
        run: |
          bun run --cwd plugin-benchmarks test
          bun run --cwd plugin-benchmarks typecheck
          bun run --cwd plugin-benchmarks build
      - name: framework typecheck
        run: bun run --cwd framework/typescript typecheck
      - name: suite tests (keyless vitest/bun-test lanes)
        run: |
          set -e
          for suite in claude-subscription-gateway configbench eliza-1 \
              entity-voice-bench interrupt-bench lifeops-quality memperf \
              personality-bench recall-bench three-agent-dialogue \
              vision-language voice-rtt; do
            echo "::group::$suite"
            (cd "suites/$suite" && bun run test)
            echo "::endgroup::"
          done

  lifeops-bench-unit:
    name: lifeops-bench unit tests
    runs-on: ubuntu-24.04
    # ~26k tests; single-threaded this takes >3h and timed out on every
    # run since the extraction. pytest-xdist (-n auto) fits it in the lane
    # (83m observed on a 4-vCPU runner, so leave real headroom).
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: uv sync (lifeops-bench)
        working-directory: suites/lifeops-bench
        run: uv sync --extra test --extra anthropic
      - name: Build deterministic LifeWorld snapshots
        working-directory: suites/lifeops-bench
        run: uv run python -m eliza_lifeops_bench.lifeworld.snapshots --rebuild
      - name: Run pytest (hermetic — no provider creds)
        working-directory: suites/lifeops-bench
        env:
          CEREBRAS_API_KEY: ""
          ANTHROPIC_API_KEY: ""
          PYTHONUNBUFFERED: "1"
        run: uv run pytest tests/ -q --tb=short -n auto
