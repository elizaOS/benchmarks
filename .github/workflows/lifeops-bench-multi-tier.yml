# LifeOps Multi-Tier Benchmark
#
# Separate from `.github/workflows/lifeops-bench-python.yml`. This workflow
# drives the `lifeops-bench` CLI and runs LifeOpsBench against the four-tier
# model registry (small / mid / large / frontier).
#
# Live-model runs only — nightly schedule + manual dispatch (no PR trigger:
# PR-scoped hermetic coverage lives in lifeops-bench-python.yml). Nightly runs
# the `core` suite over the large + frontier tiers (Cerebras gemma-4-31b +
# Anthropic frontier).
#
# All cells are skip-not-fail: missing API keys leave a SKIPPED row and never
# turn the workflow red.
#
# Local equivalents:
#   cd suites/lifeops-bench && pip install -e .
#   lifeops-bench --agent cerebras-direct --model-tier large --suite smoke
#   lifeops-bench --agent hermes --model-tier frontier --suite smoke

name: LifeOps Benchmark — Multi-Tier

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Suite to run (smoke|core|full)"
        required: false
        type: choice
        options: [smoke, core, full]
        default: smoke
      tiers:
        description: "Comma-separated tier list"
        required: false
        type: string
        default: "large,frontier"
  schedule:
    # Nightly at 03:00 UTC
    - cron: "0 3 * * *"

concurrency:
  group: lifeops-bench-multi-tier-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  resolve-inputs:
    name: "resolve-inputs"
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      suite: ${{ steps.pick.outputs.suite }}
      tiers: ${{ steps.pick.outputs.tiers }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "suite=${{ github.event.inputs.suite }}" >> "$GITHUB_OUTPUT"
            echo "tiers=${{ github.event.inputs.tiers }}" >> "$GITHUB_OUTPUT"
          else
            echo "suite=core" >> "$GITHUB_OUTPUT"
            echo "tiers=large,frontier" >> "$GITHUB_OUTPUT"
          fi

  smoke-large:
    name: "tier=large"
    needs: resolve-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check secrets
        id: gate
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          if [ -z "${CEREBRAS_API_KEY:-}" ]; then
            echo "[multi-tier] CEREBRAS_API_KEY not configured — skipping large tier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python bench package
        if: steps.gate.outputs.skip != 'true'
        working-directory: suites/lifeops-bench
        run: pip install -e .

      - name: Run multi-tier driver (large only)
        if: steps.gate.outputs.skip != 'true'
        id: run
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          set -e
          RUN_DIR="${{ github.workspace }}/runs/large"
          mkdir -p "$RUN_DIR/large"
          lifeops-bench \
            --agent cerebras-direct \
            --model-tier large \
            --suite "${{ needs.resolve-inputs.outputs.suite }}" \
            --output-dir "$RUN_DIR/large" \
            | tee multi-tier-large.log
          RESULT_JSON=$(ls -t "$RUN_DIR/large"/lifeops_*.json 2>/dev/null | head -n1 || true)
          if [ -n "$RESULT_JSON" ]; then
            cp "$RESULT_JSON" "$RUN_DIR/large/report.json"
          fi
          printf '# LifeOps Multi-Tier Benchmark\n\nTier: large\nSuite: %s\n' "${{ needs.resolve-inputs.outputs.suite }}" > "$RUN_DIR/SUMMARY.md"
          echo "run-dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload large-tier artifacts
        if: steps.gate.outputs.skip != 'true' && always() && steps.run.outputs.run-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: lifeops-multi-tier-large-${{ github.run_id }}
          path: |
            ${{ steps.run.outputs.run-dir }}/SUMMARY.md
            ${{ steps.run.outputs.run-dir }}/large/**/report.md
            ${{ steps.run.outputs.run-dir }}/large/**/report.json
            ${{ steps.run.outputs.run-dir }}/large/**/steps.csv
            ${{ steps.run.outputs.run-dir }}/deltas/**
          if-no-files-found: warn
          retention-days: 30

      - name: Skipped notice
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "::notice::LifeOps multi-tier large skipped — CEREBRAS_API_KEY not configured."

  smoke-frontier:
    name: "tier=frontier"
    needs: resolve-inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check secrets
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "[multi-tier] ANTHROPIC_API_KEY not configured — skipping frontier tier."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.gate.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Setup Python
        if: steps.gate.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python bench package
        if: steps.gate.outputs.skip != 'true'
        working-directory: suites/lifeops-bench
        run: pip install -e .

      - name: Run multi-tier driver (frontier only)
        if: steps.gate.outputs.skip != 'true'
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -e
          RUN_DIR="${{ github.workspace }}/runs/frontier"
          mkdir -p "$RUN_DIR/frontier"
          lifeops-bench \
            --agent hermes \
            --model-tier frontier \
            --suite "${{ needs.resolve-inputs.outputs.suite }}" \
            --output-dir "$RUN_DIR/frontier" \
            | tee multi-tier-frontier.log
          RESULT_JSON=$(ls -t "$RUN_DIR/frontier"/lifeops_*.json 2>/dev/null | head -n1 || true)
          if [ -n "$RESULT_JSON" ]; then
            cp "$RESULT_JSON" "$RUN_DIR/frontier/report.json"
          fi
          printf '# LifeOps Multi-Tier Benchmark\n\nTier: frontier\nSuite: %s\n' "${{ needs.resolve-inputs.outputs.suite }}" > "$RUN_DIR/SUMMARY.md"
          echo "run-dir=$RUN_DIR" >> "$GITHUB_OUTPUT"

      - name: Upload frontier-tier artifacts
        if: steps.gate.outputs.skip != 'true' && always() && steps.run.outputs.run-dir != ''
        uses: actions/upload-artifact@v4
        with:
          name: lifeops-multi-tier-frontier-${{ github.run_id }}
          path: |
            ${{ steps.run.outputs.run-dir }}/SUMMARY.md
            ${{ steps.run.outputs.run-dir }}/frontier/**/report.md
            ${{ steps.run.outputs.run-dir }}/frontier/**/report.json
            ${{ steps.run.outputs.run-dir }}/frontier/**/steps.csv
            ${{ steps.run.outputs.run-dir }}/deltas/**
          if-no-files-found: warn
          retention-days: 30

      - name: Skipped notice
        if: steps.gate.outputs.skip == 'true'
        run: |
          echo "::notice::LifeOps multi-tier frontier skipped — ANTHROPIC_API_KEY not configured."
