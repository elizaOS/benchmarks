# LifeOps Action Manifest Drift Gate
#
# Re-runs the manifest generator (TS exporter + Python umbrella augment) and
# fails if the committed `actions.manifest.json` differs from a fresh
# regeneration. This keeps `suites/lifeops-bench/manifests/` in sync with the
# actual plugin actions exposed by contacts, personal assistant, phone,
# BlueBubbles, iMessage, and todos in the elizaOS repo.
#
# The plugin sources come from the repo's `eliza/` submodule by default (a
# pinned elizaOS monorepo checkout), so the PR gate is deterministic: red
# means the committed manifest no longer matches the pinned sources — rerun
# the exporter. The nightly / workflow_dispatch run can instead target a
# moving elizaOS ref (default `develop`) to detect upstream drift ahead of a
# submodule bump.
#
# Local equivalent (run before pushing):
#
#     bun run lifeops-bench:manifest
#     git diff --exit-code suites/lifeops-bench/manifests/

name: LifeOps Action Manifest Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "suites/lifeops-bench/scripts/export-action-manifest.ts"
      - "suites/lifeops-bench/manifests/actions.manifest.json"
      - "suites/lifeops-bench/manifests/actions.summary.md"
      - "suites/lifeops-bench/eliza_lifeops_bench/manifest_export.py"
      - ".github/workflows/lifeops-bench-manifest.yml"
  schedule:
    # 05:20 UTC nightly — catches drift introduced by elizaOS plugin changes.
    - cron: "20 5 * * *"
  workflow_dispatch:
    inputs:
      eliza_ref:
        description: "elizaOS/eliza ref to generate against (empty = pinned submodule)"
        required: false
        type: string
        default: "develop"

concurrency:
  group: lifeops-bench-manifest-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  ELIZA_SKIP_ARTIFACT_SYNC: "1"

jobs:
  manifest-gate:
    name: Verify lifeops action manifest is up to date
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout benchmarks repo
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - uses: ./.github/actions/setup-eliza

      # Nightly / manual runs target a moving elizaOS ref instead of the
      # pinned submodule, to catch upstream drift ahead of a submodule bump.
      - name: Checkout elizaOS monorepo at drift ref
        if: github.event_name != 'pull_request' && (inputs.eliza_ref || 'develop') != ''
        uses: actions/checkout@v4
        with:
          repository: elizaOS/eliza
          ref: ${{ inputs.eliza_ref || 'develop' }}
          path: eliza-repo
          submodules: false
          fetch-depth: 1

      - name: Install drift-ref workspace dependencies
        if: github.event_name != 'pull_request' && (inputs.eliza_ref || 'develop') != ''
        working-directory: eliza-repo
        run: bun install --ignore-scripts --no-frozen-lockfile

      - name: Point exporter at drift ref
        if: github.event_name != 'pull_request' && (inputs.eliza_ref || 'develop') != ''
        run: echo "ELIZA_REPO_DIR=${{ github.workspace }}/eliza-repo" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python bench package
        working-directory: suites/lifeops-bench
        run: pip install -e .

      - name: Verify manifest is up to date
        run: |
          set -e
          bun run lifeops-bench:manifest
          git diff --exit-code suites/lifeops-bench/manifests/
